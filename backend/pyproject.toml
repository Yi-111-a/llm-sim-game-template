[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sim-game"
version = "0.3.0"
description = "A local-first, data-driven simulation game engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "jinja2>=3.1,<4",
  "textual>=0.80,<2",
  "typer>=0.12,<1",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[project.scripts]
sim = "cli.main:app"

[tool.setuptools.packages.find]
include = ["simcore*", "api*", "cli*"]

[tool.setuptools.package-data]
simcore = ["llm/presets.yaml", "prompts/*.md"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = [
  "import-untyped",
  "union-attr",
  "assignment",
  "attr-defined",
  "index",
  "arg-type",
  "no-redef",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
